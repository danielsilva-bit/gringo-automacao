name: Gringo RPA - preencher leads

# IMPORTANTE — trava de segurança:
# O agendamento automático (schedule) fica DESLIGADO até o robô ser validado
# manualmente (dry_run=true, depois dry_run=false numa única linha de teste).
# Enquanto isso, o único jeito de rodar é manualmente via "Run workflow".
# Depois de validar, reative o bloco `schedule:` abaixo (descomente) para voltar
# a rodar sozinho a cada 15 min.
on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em modo simulação (não envia o formulário)"
        required: false
        default: "true"

jobs:
  rodar-rpa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar robô
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          # Só roda "ao vivo" (DRY_RUN=false) quando alguém dispara manualmente
          # e escolhe explicitamente dry_run=false. Qualquer outro caso (inclusive
          # um schedule futuro reativado sem querer) cai em modo simulação, por segurança.
          DRY_RUN: ${{ github.event.inputs.dry_run != 'false' }}
        run: node preencherLead.js
