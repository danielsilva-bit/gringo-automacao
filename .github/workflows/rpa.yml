name: Gringo RPA - preencher leads

# Robô validado com lead real (protocolo TESTE001, confirmado por print do Daniel
# em 09/09) — agendamento automático reativado a pedido dele, rodando a cada 15 min.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em modo simulação (não envia o formulário)"
        required: false
        default: "true"

jobs:
  rodar-rpa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar robô
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          # Disparo automático (schedule): sempre roda "ao vivo" (DRY_RUN=false),
          # preenchendo os leads de verdade — é o objetivo do agendamento.
          # Disparo manual (workflow_dispatch): mantém o padrão seguro, só roda
          # "ao vivo" se a pessoa escolher explicitamente dry_run=false.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
        run: node preencherLead.js
