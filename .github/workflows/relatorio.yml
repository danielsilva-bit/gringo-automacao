name: Gringo Relatorio Diario

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  enviar-relatorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relatorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: npm install
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Gerar e enviar relatório (só executa de verdade no horário configurado)
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node gerarRelatorio.js
