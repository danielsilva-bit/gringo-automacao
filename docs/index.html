<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gringo — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --text: #1a1d29; --muted: #6b7280;
    --accent: #16a34a; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --text:#e7e9ee; --muted:#9aa1ac; --border:#2a2e37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .stat { font-size:26px; font-weight:700; }
  .label { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .charts{grid-template-columns:1fr;} }
  .chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .chart-card h3 { margin:0 0 12px; font-size:14px; color:var(--muted); font-weight:600; }
  .err { color:#b91c1c; font-size:13px; }
  canvas { max-height:260px; }
</style>
</head>
<body>
  <h1>Gringo — Volumetria &amp; Leads</h1>
  <div class="sub" id="atualizado">Carregando...</div>

  <div class="grid" id="stats"></div>

  <div class="charts">
    <div class="chart-card"><h3>Leads por dia</h3><canvas id="chartDia"></canvas></div>
    <div class="chart-card"><h3>Status do processamento</h3><canvas id="chartStatus"></canvas></div>
    <div class="chart-card"><h3>Com código x sem código</h3><canvas id="chartCodigo"></canvas></div>
  </div>

<script>
// Este dashboard nunca lê a planilha diretamente nem PII de cliente — ele só
// chama o endpoint getStats do Web App do Apps Script, que devolve números
// agregados (total, por dia, por status). O DASH_TOKEN abaixo é de baixo
// privilégio: só dá acesso a essas estatísticas, nada além disso.
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxU0XpwgLz9s5rvpBYUxeJTXWqx7UMN6e9nuCm5JpfRqZ39pmlaLDHsvG9K6n26JYLZcA/exec";
const DASH_TOKEN = "76012856-6680-4b87-8c9a-bf2c01465edd";

function cor(i) {
  const p = ["#16a34a","#2563eb","#f59e0b","#dc2626","#7c3aed","#0891b2"];
  return p[i % p.length];
}

async function carregar() {
  try {
    const url = `${WEBAPP_URL}?action=getStats&token=${encodeURIComponent(DASH_TOKEN)}`;
    const resp = await fetch(url, { cache: "no-store" });
    const stats = await resp.json();
    if (stats.erro) throw new Error(stats.erro);

    document.getElementById("atualizado").textContent =
      "Atualizado em " + new Date().toLocaleString("pt-BR") + " · " + stats.total + " leads na aba Entrada";

    const enviados = stats.porStatus["Enviado"] || 0;
    const pendentes = stats.porStatus["Pendente_RPA"] || 0;

    document.getElementById("stats").innerHTML = `
      <div class="card"><div class="stat">${stats.total}</div><div class="label">Leads totais</div></div>
      <div class="card"><div class="stat">${stats.comCodigo}</div><div class="label">Com código de anúncio</div></div>
      <div class="card"><div class="stat">${enviados}</div><div class="label">Enviados via RPA</div></div>
      <div class="card"><div class="stat">${pendentes}</div><div class="label">Pendentes de envio</div></div>
    `;

    const diasOrdenados = Object.keys(stats.porDia).sort();
    new Chart(document.getElementById("chartDia"), {
      type: "line",
      data: { labels: diasOrdenados, datasets: [{ label: "Leads", data: diasOrdenados.map(d=>stats.porDia[d]), borderColor: cor(0), tension:.3 }] },
      options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true} } }
    });

    new Chart(document.getElementById("chartStatus"), {
      type: "doughnut",
      data: { labels: Object.keys(stats.porStatus), datasets: [{ data: Object.values(stats.porStatus), backgroundColor: Object.keys(stats.porStatus).map((_,i)=>cor(i)) }] }
    });

    new Chart(document.getElementById("chartCodigo"), {
      type: "pie",
      data: { labels: ["Com código", "Sem código"], datasets: [{ data: [stats.comCodigo, stats.total-stats.comCodigo], backgroundColor:[cor(0), cor(3)] }] }
    });

  } catch (e) {
    document.getElementById("atualizado").innerHTML = `<span class="err">Não consegui carregar os dados: ${e.message}. Confirme WEBAPP_URL e DASH_TOKEN no topo do script.</span>`;
  }
}

carregar();
</script>
</body>
</html>
